<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Details</title>

    <link
        rel="stylesheet"
        href="studentdtls.css"
    >

</head>


<body>


    <!-- =========================================
         MAIN PAGE
         ========================================= -->

    <div class="page-container">


        <!-- =====================================
             MAIN WHITE WINDOW
             ===================================== -->

        <div class="student-details-box">


            <!-- =================================
                 HEADER
                 ================================= -->

            <div class="window-header">

                <h1>
                    Complete Your Profile
                </h1>

            </div>



            <!-- =================================
                 SCROLLABLE FORM AREA
                 ================================= -->

            <div class="form-scroll-area">


                <form
                    id="student-details-form"
                    onsubmit="submitStudentDetails(event)"
                >


                    <!-- =============================
                         FULL NAME
                         ============================= -->

                    <div class="form-section">

                        <label for="full-name">
                            Full Name
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="text"
                                id="full-name"
                                placeholder="Enter your full name"
                                autocomplete="name"
                                required
                            >

                        </div>

                    </div>



                    <!-- =============================
                         ENROLLMENT ID
                         ============================= -->

                    <div class="form-section">

                        <label for="enrollment-id">
                            Enrollment ID
                        </label>

                        <div class="input-wrapper readonly-wrapper">

                            <input
                                type="text"
                                id="enrollment-id"
                                readonly
                            >

                        </div>

                        <p class="field-note">
                            Automatically filled from your
                            verified student email.
                        </p>

                    </div>



                    <!-- =============================
                         CREATE PASSWORD
                         ============================= -->

                    <div class="form-section">

                        <label for="create-password">
                            Create Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="create-password"
                                placeholder="Create your password"
                                autocomplete="new-password"
                                required
                            >


                            <button
                                type="button"
                                class="password-toggle"
                                onclick="togglePassword('create-password', this)"
                                aria-label="Show password"
                            >

                                <!-- EYE -->

                                <svg
                                    class="eye-icon"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    xmlns="http://www.w3.org/2000/svg"
                                >

                                    <path
                                        d="M2 12C2 12 5.5 5.5 12 5.5C18.5 5.5 22 12 22 12C22 12 18.5 18.5 12 18.5C5.5 18.5 2 12 2 12Z"
                                        stroke="currentColor"
                                        stroke-width="1.8"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                    />

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="3"
                                        stroke="currentColor"
                                        stroke-width="1.8"
                                    />

                                </svg>


                                <!-- EYE SLASH -->

                                <svg
                                    class="eye-slash-icon"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    xmlns="http://www.w3.org/2000/svg"
                                >

                                    <path
                                        d="M3 3L21 21"
                                        stroke="currentColor"
                                        stroke-width="1.8"
                                        stroke-linecap="round"
                                    />

                                    <path
                                        d="M10.6 5.7C11.05 5.57 11.52 5.5 12 5.5C18.5 5.5 22 12 22 12C22 12 20.9 14.05 18.8 15.9"
                                        stroke="currentColor"
                                        stroke-width="1.8"
                                        stroke-linecap="round"
                                    />

                                    <path
                                        d="M6.2 8.1C3.45 9.95 2 12 2 12C2 12 5.5 18.5 12 18.5C13.1 18.5 14.1 18.3 15 17.95"
                                        stroke="currentColor"
                                        stroke-width="1.8"
                                        stroke-linecap="round"
                                    />

                                </svg>

                            </button>

                        </div>

                    </div>



                    <!-- =============================
                         CONFIRM PASSWORD
                         ============================= -->

                    <div class="form-section">

                        <label for="confirm-password">
                            Confirm Password
                        </label>

                        <div class="password-wrapper">


                            <input
                                type="password"
                                id="confirm-password"
                                placeholder="Confirm your password"
                                autocomplete="new-password"
                                required
                            >


                            <!-- GREEN CHECK -->

                            <span
                                class="password-match-check"
                                id="password-match-check"
                            >
                                ✓
                            </span>


                            <!-- EYE BUTTON -->

                            <button
                                type="button"
                                class="password-toggle"
                                onclick="togglePassword('confirm-password', this)"
                                aria-label="Show password"
                            >

                                <!-- EYE -->

                                <svg
                                    class="eye-icon"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    xmlns="http://www.w3.org/2000/svg"
                                >

                                    <path
                                        d="M2 12C2 12 5.5 5.5 12 5.5C18.5 5.5 22 12 22 12C22 12 18.5 18.5 12 18.5C5.5 18.5 2 12 2 12Z"
                                        stroke="currentColor"
                                        stroke-width="1.8"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                    />

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="3"
                                        stroke="currentColor"
                                        stroke-width="1.8"
                                    />

                                </svg>


                                <!-- EYE SLASH -->

                                <svg
                                    class="eye-slash-icon"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    xmlns="http://www.w3.org/2000/svg"
                                >

                                    <path
                                        d="M3 3L21 21"
                                        stroke="currentColor"
                                        stroke-width="1.8"
                                        stroke-linecap="round"
                                    />

                                    <path
                                        d="M10.6 5.7C11.05 5.57 11.52 5.5 12 5.5C18.5 5.5 22 12 22 12C22 12 20.9 14.05 18.8 15.9"
                                        stroke="currentColor"
                                        stroke-width="1.8"
                                        stroke-linecap="round"
                                    />

                                    <path
                                        d="M6.2 8.1C3.45 9.95 2 12 2 12C2 12 5.5 18.5 12 18.5C13.1 18.5 14.1 18.3 15 17.95"
                                        stroke="currentColor"
                                        stroke-width="1.8"
                                        stroke-linecap="round"
                                    />

                                </svg>

                            </button>

                        </div>


                        <p
                            class="password-message"
                            id="password-message"
                        ></p>

                    </div>



                    <!-- =============================
                         PROGRAMME
                         ============================= -->

                    <div class="form-section">

                        <label>
                            Programme
                        </label>


                        <div
                            class="custom-select"
                            id="programme-select"
                        >

                            <button
                                type="button"
                                class="select-display"
                                id="programme-display"
                                aria-expanded="false"
                            >

                                <span id="programme-text">
                                    Select Programme
                                </span>

                                <span class="select-arrow">
                                    ▼
                                </span>

                            </button>


                            <!-- PROGRAMME OPTIONS -->

                            <div
                                class="select-menu"
                                id="programme-menu"
                            >

                                <button
                                    type="button"
                                    class="select-option"
                                    data-value="B.Tech"
                                >
                                    Bachelor of Technology
                                    (B. Tech.)
                                </button>


                                <button
                                    type="button"
                                    class="select-option"
                                    data-value="B.Arch"
                                >
                                    Bachelor of Architecture
                                    (B. Arch.)
                                </button>


                                <button
                                    type="button"
                                    class="select-option"
                                    data-value="Dual B.Tech-M.Tech"
                                >
                                    Dual Degree
                                    (B. Tech. - M. Tech.)
                                </button>


                                <button
                                    type="button"
                                    class="select-option"
                                    data-value="Dual BS-MS"
                                >
                                    Dual Degree
                                    [Bachelor of Science (BS)
                                    and Master of Science (MS)]
                                </button>

                            </div>

                        </div>


                        <input
                            type="hidden"
                            id="programme"
                            required
                        >

                    </div>



                    <!-- =============================
                         DEPARTMENT
                         ============================= -->

                    <div class="form-section">

                        <label>
                            Department
                        </label>


                        <div
                            class="custom-select disabled-select"
                            id="department-select"
                        >

                            <button
                                type="button"
                                class="select-display"
                                id="department-display"
                                aria-expanded="false"
                                disabled
                            >

                                <span id="department-text">
                                    Select Programme First
                                </span>

                                <span class="select-arrow">
                                    ▼
                                </span>

                            </button>


                            <div
                                class="select-menu"
                                id="department-menu"
                            ></div>

                        </div>


                        <input
                            type="hidden"
                            id="department"
                            required
                        >


                        <p
                            class="field-note"
                            id="department-note"
                        >
                            Select a programme to view the
                            available departments.
                        </p>

                    </div>



                    <!-- =============================
                         PHONE NUMBER
                         ============================= -->

                    <div class="form-section">

                        <label for="phone-number">
                            Phone Number
                        </label>


                        <div class="input-wrapper">

                            <input
                                type="tel"
                                id="phone-number"
                                placeholder="Enter phone number"
                                autocomplete="tel"
                            >

                        </div>

                    </div>


                </form>

            </div>



            <!-- =================================
                 FIXED NAVIGATION
                 ================================= -->

            <div class="navigation-footer">


                <!-- BACK -->

                <button
                    type="button"
                    class="back-btn"
                    onclick="goBack()"
                >
                    &lt; Back
                </button>


                <!-- CONTINUE -->

                <button
                    type="submit"
                    class="continue-btn"
                    form="student-details-form"
                >
                    Continue
                </button>


            </div>


        </div>

    </div>



    <!-- =========================================
         JAVASCRIPT
         ========================================= -->

    <script src="studentdtls.js"></script>


</body>

</html>
